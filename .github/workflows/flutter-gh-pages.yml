name: Flutter Web to GitHub Pages

on:
  push:
    branches:
      - test/testowy
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    env:
      REPO_NAME: ${{ github.event.repository.name }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter doctor
        run: flutter doctor -v | cat

      - name: Enable web
        run: flutter config --enable-web | cat

      - name: Ensure web platform files (non-overwrite)
        run: flutter create . --platforms=web | cat

      - name: Clean
        run: flutter clean | cat

      - name: Install dependencies
        run: flutter pub get | cat

      - name: Build web (force JS)
        run: flutter build web --release --no-wasm --no-tree-shake-icons --base-href "/${{ env.REPO_NAME }}/" | cat

      - name: Verify build artifacts
        run: |
          ls -la build/web | cat
          test -f build/web/index.html
          test -f build/web/flutter_service_worker.js
          test -f build/web/main.dart.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: build/web
          force_orphan: true

      - name: Publish deployed URL
        if: success()
        run: |
          URL="https://${OWNER}.github.io/${REPO_NAME}/"
          echo "::notice title=GitHub Pages::${URL}"
          echo "### ✅ Deploy zakończony" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Aplikacja jest dostępna pod adresem: ${URL}" >> $GITHUB_STEP_SUMMARY