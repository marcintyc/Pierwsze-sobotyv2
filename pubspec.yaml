name: pierwsze_soboty
description: Aplikacja mobilna "Pierwsze Soboty" poświęcona nabożeństwu pierwszych sobót miesiąca.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.2.2
  table_calendar: ^3.0.9
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.2
  lottie: ^3.1.2
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/